name: 🚀 Deploy to Develop Kubernetes

on:
  pull_request:
    types: [closed]
 
permissions:
  contents: write 

jobs: 
  deploy-develop:
    # Solo desplegar cuando el PR fue mergeado a develop, o en push directo a develop
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop'
    runs-on: [self-hosted, develop]
    
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Bump de versión PATCH automático por tags tipo x.y.z
      - name: Bump patch version via GitHub Script
        id: getver
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tagsResp = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              per_page: 100
            });
            const versions = tagsResp.data
              .map(t => t.name.replace(/^v/, ''))
              .filter(v => /^\d+\.\d+\.\d+$/.test(v));
            let bumped;
            if (versions.length === 0) {
              bumped = '0.1.0';
            } else {
              versions.sort((a, b) => {
                const [am, an, ap] = a.split('.').map(Number);
                const [bm, bn, bp] = b.split('.').map(Number);
                if (am !== bm) return bm - am;
                if (an !== bn) return bn - an;
                return bp - ap;
              });
              const [maj, min, pat] = versions[0].split('.').map(Number);
              bumped = [maj, min, pat + 1].join('.');
            }
            core.setOutput('version', bumped);

      - name: Mostrar versión generada
        run: echo "→ VERSION = ${{ steps.getver.outputs.version }}"

      # Release automático
      - name: Crear Release en GitHub
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.getver.outputs.version }}
          release_name: Release ${{ steps.getver.outputs.version }}
          draft: false
          prerelease: false

      # Debug: usuarios y estado docker
      - name: Verificar acceso a Docker y K3s
        run: |
          whoami
          docker ps
          sudo k3s ctr images ls

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🛠️ Build y push de imagen Docker
        run: |
          docker build -t developmentzarcom/webui:${{ steps.getver.outputs.version }} .
          docker push developmentzarcom/webui:${{ steps.getver.outputs.version }}

      # Opcional: Verificar que la imagen existe en docker local antes de exportar
      - name: Verificar imagen local
        run: |
          docker images | grep webui

      - name: Importar imagen a K3s (containerd)
        run: |
          docker save developmentzarcom/webui:${{ steps.getver.outputs.version }} -o webui.tar
          sudo k3s ctr images import webui.tar

      - name: Set up kubeconfig (si tu runner no lo tiene global)
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > $HOME/.kube/config

      - name: Ensure namespace exists
        run: |
          kubectl get namespace develop || kubectl create namespace develop

      - name: Aplicar deployment.yaml (crea si no existe, actualiza si existe)
        run: |
          kubectl apply -f deployment_develop.yaml

      - name: List deployments en develop namespace (debug)
        run: |
          kubectl get deployments -n develop

      - name: Actualizar imagen en el deployment de Kubernetes
        run: |
          kubectl set image deployment/platform-back webui=developmentzarcom/webui:${{ steps.getver.outputs.version }} --namespace develop

      - name: 🔄 Rollout restart y monitoreo de status
        run: |
          kubectl rollout restart deployment/platform-back --namespace develop
          kubectl rollout status deployment/platform-back --namespace develop --timeout=180s || \
          kubectl get pods -n develop -o name | grep platform-back | xargs -r kubectl delete --grace-period=0 --force -n develop


  approval-qa:
    name: ⏸️ Espera aprobación para QA
    needs: deploy-develop
    runs-on: ubuntu-latest   # así no bloqueás tu self-hosted
    steps:
      - name: Crear gate de aprobación
        # Doc oficial: secret + approvers (+ opcionales)
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}        # ⬅️ antes pusiste repo-token; va 'secret'
          approvers: cesarzanello                    # tu usuario (o varios, separados por coma)
          minimum-approvals: 1
          issue-title: "Aprobar deploy a QA"
          issue-body: |
            DEVELOP OK para run ${{ github.run_id }}.
            Comentá **approve** para continuar o **deny** para cancelar.

  deploy-qa:
    name: Deploy Production
    needs: [deploy-develop, approval-qa] 
    runs-on: [self-hosted, qa]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Bump de versión PATCH automático por tags tipo x.y.z
      - name: Bump patch version via GitHub Script
        id: getver
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tagsResp = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              per_page: 100
            });
            const versions = tagsResp.data
              .map(t => t.name.replace(/^v/, ''))
              .filter(v => /^\d+\.\d+\.\d+$/.test(v));
            let bumped;
            if (versions.length === 0) {
              bumped = '0.1.0';
            } else {
              versions.sort((a, b) => {
                const [am, an, ap] = a.split('.').map(Number);
                const [bm, bn, bp] = b.split('.').map(Number);
                if (am !== bm) return bm - am;
                if (an !== bn) return bn - an;
                return bp - ap;
              });
              const [maj, min, pat] = versions[0].split('.').map(Number);
              bumped = [maj, min, pat + 1].join('.');
            }
            core.setOutput('version', bumped);

      - name: Mostrar versión generada
        run: echo "→ VERSION = ${{ steps.getver.outputs.version }}"

      # Release automático
      - name: Crear Release en GitHub
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.getver.outputs.version }}
          release_name: Release ${{ steps.getver.outputs.version }}
          draft: false
          prerelease: false

      # Debug: usuarios y estado docker

      - name: Verificar acceso a Docker y K3s
        run: |
          whoami
          docker ps
          sudo k3s ctr images ls
          
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🛠️ Build y push de imagen Docker
        run: |
          docker build -t developmentzarcom/webui:${{ steps.getver.outputs.version }} .
          docker push developmentzarcom/webui:${{ steps.getver.outputs.version }}

      # Opcional: Verificar que la imagen existe en docker local antes de exportar
      - name: Verificar imagen local
        run: |
          docker images | grep webui

      - name: Importar imagen a K3s (containerd)
        run: |
          docker save developmentzarcom/webui:${{ steps.getver.outputs.version }} -o webui.tar
          sudo k3s ctr images import webui.tar

      - name: Set up kubeconfig (si tu runner no lo tiene global)
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > $HOME/.kube/config

      - name: Ensure namespace exists
        run: |
          kubectl get namespace qa || kubectl create namespace qa

      - name: Aplicar deployment.yaml (crea si no existe, actualiza si existe)
        run: |
          kubectl apply -f deployment_qa.yaml

      - name: List deployments en qa namespace (debug)
        run: |
          kubectl get deployments -n qa

      - name: Actualizar imagen en el deployment de Kubernetes
        run: |
          kubectl set image deployment/platform-back webui=developmentzarcom/webui:${{ steps.getver.outputs.version }} --namespace qa

      - name: 🔄 Rollout restart y monitoreo de status
        run: |
          kubectl rollout restart deployment/platform-back --namespace qa
          kubectl rollout status deployment/platform-back --namespace qa --timeout=180s || \
          kubectl get pods -n qa -o name | grep platform-back | xargs -r kubectl delete --grace-period=0 --force -n qa
